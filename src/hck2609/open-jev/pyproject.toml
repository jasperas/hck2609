[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-jev"
version = "0.1.0"
description = "A from-first-principles reconstruction of Jev-style typed decision models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.14.0",
]

[tool.setuptools.packages.find]
include = ["open_jev*"]
